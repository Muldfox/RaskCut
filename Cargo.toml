[package]
name = "raskcut"
version = "1.2.0"
edition = "2021"

[[bin]]
name = "RaskCut"
path = "src/main.rs"

[dependencies]
eframe = "0.33"
rfd = "0.15"
serde_json = "1"
dirs = "6"
arboard = { version = "3.7", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
